# Platform modules install from main; SILVAENGINE_SRC optionally overrides them locally.
services:
  gateway:
    # This tag is built locally, not downloaded from a container registry.
    pull_policy: build
    build:
      context: .
      args:
        PYTHON_IMAGE: ${DOCKER_MIRROR_PREFIX:-docker.1ms.run/library/}python:3.12-slim
        PIP_INDEX_URL: ${PIP_INDEX_URL:?set PIP_INDEX_URL in .env}
      secrets:
        - github_ssh_key
    environment:
      PYTHONPATH: ${SILVAENGINE_SRC:+/app/src/silvaengine_constants:/app/src/silvaengine_utility:/app/src/silvaengine_dynamodb_base:/app/src/silvaengine_definitions:/app/src/silvaengine_connections:/app/src/silvaengine_base:/app/src/mcp_http_client:/app/src/silvaengine_daemon:/app/src/mcp_protocol_plugin:/app/src/silvaengine_gateway:}/app/modules/agent_engine:/app/modules/capability_engine:/app/modules/knowledge_engine:/app/modules/llm_engine:/app/modules/memory_engine:/app/modules/merchant_engine:/app/modules/monitor_engine:/app/modules/orchestration_engine:/app/modules/perm_engine:/app/modules/prompt_engine:/app/modules/setting_engine:/app/modules/user_engine:/app/modules/llm_provider_base:/app/modules/llm_provider_anthropic:/app/modules/llm_provider_openai:/app/modules/llm_provider_openai_chat:/app/modules/llm_provider_gemini:/app/modules/llm_provider_ollama${EXTRA_PYTHONPATH:+:${EXTRA_PYTHONPATH}}
      SILVAENGINE_CACHE_TTL: ${SILVAENGINE_CACHE_TTL:-300}
    volumes:
      # Framework source workspace, matching the A2A layout. SILVAENGINE_SRC
      # enables framework PYTHONPATH entries; otherwise installed main packages win.
      - type: bind
        source: ${SILVAENGINE_SRC:-./www/projects}
        target: /app/src
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BANYAN_MODULES_DIR:?set BANYAN_MODULES_DIR in .env}
        target: /app/modules
        read_only: true
        bind:
          create_host_path: false
      # Optional add-on module repos (e.g. RFQ migration E2E). Point
      # EXTRA_MODULES_DIR at any host directory of module checkouts and
      # append one "/app/extra_modules/<repo>" entry per repo to
      # EXTRA_PYTHONPATH (colon-separated, N entries supported). Example in
      # .env:
      #   EXTRA_MODULES_DIR=C:/Users/bibo7/gitrepo/silvaengine
      #   EXTRA_PYTHONPATH=/app/extra_modules/rfq_engine
      # Defaults to the shared www/projects workspace. Select addon packages
      # explicitly through EXTRA_PYTHONPATH.
      - type: bind
        source: ${EXTRA_MODULES_DIR:-./www/projects}
        target: /app/extra_modules
        read_only: true

secrets:
  github_ssh_key:
    file: ${SSH_PRIVATE_KEY_FILE:-./.ssh/id_ed25519}
