# Optional runtime Git access for administrator-controlled MCP installations.
# Reuse the protected key configured by SSH_PRIVATE_KEY_FILE.
services:
  gateway:
    environment:
      MCP_GIT_SSH_KEY_FILE: /run/secrets/github_ssh_key
    secrets:
      - github_ssh_key
    volumes:
      - type: bind
        source: ./scripts/gateway_app.py
        target: /app/scripts/gateway_app.py
        read_only: true
        bind:
          create_host_path: false
