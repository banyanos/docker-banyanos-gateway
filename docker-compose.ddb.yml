# Optional DynamoDB Local service for application data. Configuration uses JSON.
# Stack with docker-compose.yml and docker-compose.bindmount.yml when needed.
services:
  ddb-local:
    image: amazon/dynamodb-local:latest
    container_name: banyanos-ddb-local
    ports:
      - "127.0.0.1:${DYNAMODB_HOST_PORT:-8001}:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
