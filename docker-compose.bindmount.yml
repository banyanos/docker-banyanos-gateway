# SilvaEngine packages are pip-installed in the image; only Banyanos source is mounted.
services:
  gateway:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${DOCKER_MIRROR_PREFIX:-docker.1ms.run/library/}python:3.12-slim
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
      secrets:
        - github_ssh_key
    environment:
      PYTHONPATH: /app/modules/agent_engine:/app/modules/capability_engine:/app/modules/knowledge_engine:/app/modules/llm_engine:/app/modules/memory_engine:/app/modules/merchant_engine:/app/modules/monitor_engine:/app/modules/orchestration_engine:/app/modules/perm_engine:/app/modules/prompt_engine:/app/modules/setting_engine:/app/modules/user_engine
      SILVAENGINE_CACHE_TTL: ${SILVAENGINE_CACHE_TTL:-300}
    volumes:
      - type: bind
        source: ${BANYAN_MODULES_DIR:?set BANYAN_MODULES_DIR in .env}
        target: /app/modules
        read_only: true
        bind:
          create_host_path: false

secrets:
  github_ssh_key:
    file: ${SSH_PRIVATE_KEY_FILE:-./.ssh/id_ed25519}
