# =============================================================================
# SilvaEngine Gateway — Banyan production data plane (P0 minimal delivery, no nginx)
#
#   cd docker-banyanos-gateway && cp <env block, see README §2> .env && docker compose up -d
#
# Architecture: browser/frontend → gateway (single FastAPI container, 12 engines
#   dispatched in-process) → postgres / neo4j / redis; se-configdata settings
#   are read directly from env/se-configdata.local.json at startup.
#
# Gateway image requirements:
#   The default source overlay installs third-party dependencies in the image
#   plus platform modules from main, and mounts Banyanos engines/provider
#   plugins at /app/modules/<repo>. Setting SILVAENGINE_SRC optionally mounts
#   framework source at /app/src/<repo>. Without the overlay, a prebuilt
#   image must supply all of these packages itself.
#   Missing any path entry makes that engine's import fail → auth layer
#   Permission denied → blanket 403 (the same pitfall api-runtime hit;
#   include everything).
#
# All services share json-file log rotation (10MB × 3); startup order is
# enforced by depends_on + healthcheck.
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway:
    # Extended image (see header). GATEWAY_IMAGE is set in .env, e.g. the
    # Banyan gateway image built by the docker-silvaengine-gateway repo.
    image: ${GATEWAY_IMAGE:?set GATEWAY_IMAGE in .env}
    container_name: banyanos-gateway
    ports:
      - "${GATEWAY_HOST_PORT:-8000}:8000"
    env_file:
      - ./.env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # Banyan hosting switches (Banyan hosting built into the gateway):
      #   SETTING_SOURCE=json overlays the mounted JSON before initialization.
      #   db_backend independently selects application data storage.
      #   ENDPOINT_ID/ADAPTER_STAGE/ADAPTER_AREA → form the se-configdata
      #     setting_id ({stage}_{area}_{endpoint_id}); the PermAuthorizer
      #     auth bridge and path normalizer mount per the route manifest's
      #     auth_bridge, independent of ENDPOINT_ID
      - SETTING_SOURCE=${SETTING_SOURCE:-json}
      - SETTING_JSON_FILE=/app/env/se-configdata.local.json
      - db_backend=${db_backend:-postgresql}
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${POSTGRES_USER:?set POSTGRES_USER in .env}
      - PG_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - PG_DB=${POSTGRES_DB:?set POSTGRES_DB in .env}
      - ENDPOINT_ID=${ENDPOINT_ID:-banyan}
      - ADAPTER_STAGE=${ADAPTER_STAGE:-beta}
      - ADAPTER_AREA=${ADAPTER_AREA:-core}
      # Cross-engine httpx pool loopback: engine-to-engine calls inside the
      # container bypass the cloud API Gateway and go through this gateway
      # (the auth bridge verifies engine service tokens — same code path as
      # frontend calls). base_url is rewritten to this value at startup;
      # engines' upstream LLM calls pass absolute URLs and are unaffected.
      - BANYAN_LOOPBACK_BASE_URL=${BANYAN_LOOPBACK_BASE_URL:-http://127.0.0.1:8000/beta/core/banyan}
      # capability_engine loops back to this gateway's mcp_protocol_plugin routes
      # (/{endpoint_id}/mcp_daemon_graphql etc., the gateway's native single-segment
      # paths, no stage/area prefix). A capability_mcp_gateway_base_url in
      # se-configdata takes precedence.
      - CAPABILITY_MCP_GATEWAY_BASE_URL=${CAPABILITY_MCP_GATEWAY_BASE_URL:-http://127.0.0.1:8000}
    volumes:
      - type: bind
        source: ./env/se-configdata.local.json
        target: /app/env/se-configdata.local.json
        read_only: true
        bind:
          create_host_path: false
    command:
      - uvicorn
      - scripts.gateway_app:create_app_from_env
      - --factory
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # In-flight GraphQL requests can take tens of seconds; allow enough drain
    # time on restart/pull
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); sys.exit(0 if r.status==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging: *default-logging

  postgres:
    # Unified store for relational/log data (shared by the 12 engines; audit/
    # telemetry pools use separate databases on the same instance or the same DB)
    image: ${DOCKER_MIRROR_PREFIX:-docker.1ms.run/library/}postgres:16
    container_name: banyanos-postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?set POSTGRES_USER in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:?set POSTGRES_DB in .env}
    # Mount where the image's declared VOLUME lives (/var/lib/postgresql/data).
    # Mounting only the parent dir lets the image's anonymous VOLUME shadow
    # the named one at the real data path, wiping pg data on every container
    # recreate (down/up). Mounting the data path keeps data across recreates.
    volumes:
      - gateway-pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  neo4j:
    # Sole store for graph and vector data (knowledge-graph entities/relations,
    # memory link edges, embedding vectors)
    image: ${DOCKER_MIRROR_PREFIX:-docker.1ms.run/library/}neo4j:5.26-ubi10
    container_name: banyanos-neo4j
    ports:
      - "${NEO4J_HTTP_HOST_PORT:-7474}:7474"
      - "${NEO4J_BOLT_HOST_PORT:-7687}:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:?set NEO4J_AUTH in .env}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      # Explicit pagecache cap (the default can reach 50% of host RAM, an OOM
      # risk on small machines)
      - NEO4J_server_memory_pagecache_size=256m
    volumes:
      - gateway-neo4j-data:/data
      - gateway-neo4j-logs:/logs
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      # No wget/curl in the image; probe the bolt port via bash /dev/tcp
      # (proven in api-runtime)
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/7687'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *default-logging

  redis:
    # Transient data: short-lived tokens, verification codes, MFA sessions; AOF persistence
    image: ${DOCKER_MIRROR_PREFIX:-docker.1ms.run/library/}redis:7
    container_name: banyanos-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env} --appendonly yes
    environment:
      # redis-cli reads REDISCLI_AUTH natively — password-free healthcheck ping
      - REDISCLI_AUTH=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - gateway-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging


volumes:
  gateway-pg-data:
    name: banyanos-gateway_pg-data
  gateway-neo4j-data:
    name: banyanos-gateway_neo4j-data
  gateway-neo4j-logs:
    name: banyanos-gateway_neo4j-logs
  gateway-redis-data:
    name: banyanos-gateway_redis-data
